name: Android release

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Validate backend contract
        working-directory: services/functions
        run: |
          npm install
          npm run build
          NEXOVA_ENVIRONMENT=development NEXOVA_STORAGE_MODE=memory node dist/server-local.js > "$RUNNER_TEMP/nexova-api.log" 2>&1 &
          API_PID=$!
          trap 'kill $API_PID' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          API_BASE_URL=http://127.0.0.1:8787 npm run smoke

      - name: Validate migration security markers
        run: |
          test "$(grep -c "enable row level security" supabase/migrations/20260920000000_initial_schema.sql)" -ge 10
          grep -q "tenant_members_can_write_orders" supabase/migrations/20260920000000_initial_schema.sql
          grep -q "revoked_at is null" supabase/migrations/20260920000000_initial_schema.sql
          grep -q "tenant_members_can_read_payments" supabase/migrations/20260920000000_initial_schema.sql

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXOVA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexova-release.jks"
          chmod 600 "$RUNNER_TEMP/nexova-release.jks"

      - name: Build signed production AAB
        env:
          NEXOVA_SUPABASE_URL: ${{ vars.NEXOVA_SUPABASE_URL }}
          NEXOVA_SUPABASE_ANON_KEY: ${{ vars.NEXOVA_SUPABASE_ANON_KEY }}
          NEXOVA_RELEASE_STORE_FILE: ${{ runner.temp }}/nexova-release.jks
          NEXOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NEXOVA_RELEASE_STORE_PASSWORD }}
          NEXOVA_RELEASE_KEY_ALIAS: ${{ secrets.NEXOVA_RELEASE_KEY_ALIAS }}
          NEXOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NEXOVA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: nexova-pos-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
